plugins {
    // see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
    id 'net.fabricmc.fabric-loom' version '1.18.1' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.147' apply false
}

// Load local configuration if present (e.g. gradle-local.properties)
def localPropertiesFile = file('gradle-local.properties')
if (localPropertiesFile.exists()) {
    def localProperties = new Properties()
    localPropertiesFile.withInputStream { localProperties.load(it) }
    localProperties.each { key, value ->
        project.ext.set(key.toString(), value)
    }
}

def getMultiMcModsDir() {
    if (project.hasProperty('multimcModsDir')) {
        return project.property('multimcModsDir').toString()
    }
    def envDir = System.getenv('MULTIMC_MODS_DIR')
    if (envDir != null && !envDir.trim().isEmpty()) {
        return envDir.trim()
    }
    return null
}

def deployJar(File jarFile, String loaderName) {
    def targetDirStr = getMultiMcModsDir()
    if (targetDirStr == null || targetDirStr.contains('REPLACE_WITH_YOUR_INSTANCE_PATH')) {
        throw new GradleException("MultiMC mods directory is not configured. Please set 'multimcModsDir' in gradle-local.properties or gradle.properties, or set MULTIMC_MODS_DIR environment variable.")
    }
    def targetDir = file(targetDirStr)
    if (!targetDir.exists() || !targetDir.isDirectory()) {
        throw new GradleException("Configured MultiMC mods directory does not exist or is not a directory: ${targetDir.absolutePath}")
    }

    copy {
        from jarFile
        into targetDir
    }
    println "Successfully deployed [${loaderName}] ${jarFile.name} -> ${targetDir.absolutePath}"
}

tasks.register('buildAllMods') {
    group = 'build'
    description = 'Builds all supported mod loader JARs.'
    dependsOn ':fabric:build', ':neoforge:build'
}

// --- Fabric Tasks ---
tasks.register('buildFabric') {
    group = 'fabric'
    description = 'Builds the Fabric mod JAR.'
    dependsOn ':fabric:build'
}

tasks.register('runFabricClient') {
    group = 'fabric'
    description = 'Runs the Fabric development client.'
    dependsOn ':fabric:runClient'
}

tasks.register('runFabricServer') {
    group = 'fabric'
    description = 'Runs the Fabric development server.'
    dependsOn ':fabric:runServer'
}

tasks.register('cleanFabric') {
    group = 'fabric'
    description = 'Cleans Fabric build outputs.'
    dependsOn ':fabric:clean'
}

// --- NeoForge Tasks ---
tasks.register('buildNeoForge') {
    group = 'neoforge'
    description = 'Builds the NeoForge mod JAR.'
    dependsOn ':neoforge:build'
}

tasks.register('runNeoForgeClient') {
    group = 'neoforge'
    description = 'Runs the NeoForge development client.'
    dependsOn ':neoforge:runClient'
}

tasks.register('runNeoForgeServer') {
    group = 'neoforge'
    description = 'Runs the NeoForge development server.'
    dependsOn ':neoforge:runServer'
}

tasks.register('cleanNeoForge') {
    group = 'neoforge'
    description = 'Cleans NeoForge build outputs.'
    dependsOn ':neoforge:clean'
}

tasks.register('deployFabricToMultiMC') {
    group = 'deployment'
    description = 'Deploys the Fabric mod JAR to MultiMC.'
    dependsOn ':fabric:build'
    doLast {
        def jar = project(':fabric').tasks.remapJar.archiveFile.get().asFile
        deployJar(jar, 'Fabric')
    }
}

tasks.register('deployNeoForgeToMultiMC') {
    group = 'deployment'
    description = 'Deploys the NeoForge mod JAR to MultiMC.'
    dependsOn ':neoforge:build'
    doLast {
        def jar = project(':neoforge').tasks.jar.archiveFile.get().asFile
        deployJar(jar, 'NeoForge')
    }
}

tasks.register('buildAndDeploy') {
    group = 'deployment'
    description = 'Builds all mod JARs and deploys them to the configured MultiMC instance.'
    dependsOn 'deployFabricToMultiMC', 'deployNeoForgeToMultiMC'
}
